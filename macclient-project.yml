# Vamp Control for direct (website) distribution. Everything comes from
# macclient-core-project.yml; this file only adds the Sparkle in-app updater.
# The App Store spec includes the core spec alone, so that build never links Sparkle.
#
# Regenerate with: xcodegen generate --spec macclient-project.yml
include:
  - path: macclient-core-project.yml

name: MacClient

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  MacClientApp:
    dependencies:
      - package: Sparkle
        product: Sparkle
