name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Swift package dependencies
        # The runner's SwiftPM rewrites Package.resolved's format version, so an
        # exact `git diff` check against it can never pass at the package-root
        # scope. Resolving still fails CI if a pinned dependency is unavailable
        # or incompatible; the app targets' own resolved lockfiles govern the
        # xcodebuild steps below.
        run: swift package resolve

      - name: Run core tests
        run: swift test

      # Reviewed SwiftTerm 1.20.0 plugin only; keep fingerprint validation enabled.
      # This build tool writes version metadata into its sandboxed output folder.
      - name: Trust pinned SwiftTerm build plugin
        run: |
          mkdir -p "$HOME/Library/org.swift.swiftpm/security"
          cp .github/swiftpm/plugins.json "$HOME/Library/org.swift.swiftpm/security/plugins.json"

      - name: Resolve app dependencies
        run: >-
          xcodebuild
          -resolvePackageDependencies
          -project RemoteDesktopToolApps.xcodeproj

      - name: Build host
        run: >-
          xcodebuild
          -project RemoteDesktopToolApps.xcodeproj
          -scheme MacHost
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build terminal-only macOS host
        run: >-
          xcodebuild
          -project RemoteDesktopToolApps.xcodeproj
          -scheme VampTerminalHost
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build menu-bar mini host
        run: >-
          xcodebuild
          -project RemoteDesktopToolApps.xcodeproj
          -scheme VampMiniHost
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build iOS terminal client
        run: >-
          xcodebuild
          -project RemoteDesktopToolApps.xcodeproj
          -scheme VampTerminalApp
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build iOS terminal client (device slice)
        # Release IPAs are built for iphoneos only at tag time; without this
        # leg a device-only compile error can sit on main undetected. No
        # signing identity is needed for an unsigned device build.
        run: >-
          xcodebuild
          -project RemoteDesktopToolApps.xcodeproj
          -scheme VampTerminalApp
          -configuration Debug
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Generate Vamp Stream project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec vampstream-project.yml

      - name: Build Vamp Stream (release device slice)
        # Stream owns sources outside the shared ClientiOS SwiftPM target.
        # Compile the shipping configuration before changes reach a release tag.
        run: >-
          xcodebuild
          -project VampStream.xcodeproj
          -scheme VampStream
          -configuration Release
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

  test-arm64:
    # Release hosts and IPAs ship arm64, but the main build job runs on an
    # Intel runner. Re-run the core suite on Apple silicon so arm64-only codegen
    # or pointer-width regressions fail CI instead of the release.
    name: Core tests (arm64)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run core tests
        run: swift test

  host-scripts:
    # The Linux host and the browser VT emulator are not Swift and never ran in
    # CI, so regressions in them shipped unnoticed. Exercise both cheap suites on
    # a Linux runner. Uses the runner's preinstalled python3/node to avoid adding
    # unpinned setup actions.
    name: Host scripts (Linux host + browser VT)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux host unit tests
        run: python3 -m unittest discover -s Tests -p 'test_*.py' -v

      - name: Browser VT regression
        run: node Tests/BrowserTerminalVTTests.mjs

      - name: Linux browser Chat regression
        run: node Tests/LinuxBrowserChatTests.mjs
