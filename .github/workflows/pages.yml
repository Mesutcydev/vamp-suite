name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  release:
    types: [published, edited, released, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release edits must not deploy the tagged (older) tree over main.
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Resolve latest release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/generate-pages-release.py
      - name: Validate site links and release selection
        run: |
          python3 -m unittest discover -s Tests -p test_generate_pages_release.py
          python3 scripts/verify-pages-links.py
      - name: Upload static site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
