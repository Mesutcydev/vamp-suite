name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  release:
    types: [published, edited, released, deleted]
  workflow_dispatch:
    inputs:
      product:
        description: Product to refresh (all refreshes every product)
        type: choice
        default: all
        options:
          - all
          - vamp-mini-host-dmg
          - vamp-control-macos
          - vamp-control-ios
          - vamp-stream-ios
          - vamp-assistant-macos
          - vamp-assistant-ios

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release edits must not deploy the tagged (older) tree over main.
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Resolve latest release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_PRODUCT: ${{ inputs.product }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$RELEASE_TAG" == vamp-sync-* ]]; then
            PAGES_PRODUCT=vamp-mini-host-dmg
          fi
          if [[ -n "$PAGES_PRODUCT" && "$PAGES_PRODUCT" != all ]]; then
            python3 scripts/generate-pages-release.py --product "$PAGES_PRODUCT"
          else
            python3 scripts/generate-pages-release.py
          fi
      - name: Validate site links and release selection
        run: |
          python3 -m unittest discover -s Tests -p test_generate_pages_release.py
          python3 scripts/verify-pages-links.py
      - name: Upload static site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
