name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "21 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }} (${{ matrix.component }})
    permissions:
      contents: read
      security-events: write
    runs-on: macos-15-intel
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            build-mode: manual
            component: host
            scheme: MacHost
            destination: platform=macOS
            category: /language:swift/component:host
          - language: swift
            build-mode: manual
            component: macos-client
            scheme: VampTerminalHost
            destination: platform=macOS
            category: /language:swift/component:terminal-host
          - language: swift
            build-mode: manual
            component: macos-mini-host
            scheme: VampMiniHost
            destination: platform=macOS
            category: /language:swift/component:mini-host
          - language: swift
            build-mode: manual
            component: ios-terminal-client
            scheme: VampTerminalApp
            destination: generic/platform=iOS Simulator
            category: /language:swift/component:ios-terminal-client
          - language: c-cpp
            build-mode: none
            component: core
            category: /language:c-cpp/component:core
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Reviewed SwiftTerm 1.20.0 plugin only; keep fingerprint validation enabled.
      # This build tool writes version metadata into its sandboxed output folder.
      - name: Trust pinned SwiftTerm build plugin
        if: matrix.build-mode == 'manual'
        run: |
          mkdir -p "$HOME/Library/org.swift.swiftpm/security"
          cp .github/swiftpm/plugins.json "$HOME/Library/org.swift.swiftpm/security/plugins.json"

      - name: Resolve app dependencies
        if: matrix.build-mode == 'manual'
        run: >-
          xcodebuild
          -resolvePackageDependencies
          -project RemoteDesktopToolApps.xcodeproj

      - name: Build Swift app target
        if: matrix.build-mode == 'manual'
        run: >-
          xcodebuild
          -project RemoteDesktopToolApps.xcodeproj
          -scheme "${{ matrix.scheme }}"
          -configuration Debug
          -destination "${{ matrix.destination }}"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          category: ${{ matrix.category }}

  required-analysis:
    # Preserve the branch-protection check names while retaining every component
    # scan above. A failed, skipped, or cancelled matrix must never report success.
    name: Analyze ${{ matrix.language }}
    needs: analyze
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        language: [swift, c-cpp]
    steps:
      - name: Require all component analyses
        env:
          ANALYSIS_RESULT: ${{ needs.analyze.result }}
        run: test "$ANALYSIS_RESULT" = success
